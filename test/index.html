<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,test,test-mocha,mocha-browser">
    <meta name="description" content="testing epub-js library with mocha-browser">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="stylesheet" type="text/css" href="../dist/mocha.css">
    <link rel="stylesheet" type="text/css" href="../assets/css/test.css">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <script type="text/javascript" src="../assets/js/test.js"></script>
    <script type="text/javascript" src="../dist/jszip.min.js"></script>
    <script type="text/javascript" src="../dist/localforage.min.js"></script>
    <script type="text/javascript" src="../dist/mocha.js"></script>
    <script type="module" src="../dist/test.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <title>epub-js-test : testing to the mocha-browser model</title>
  </head>

  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">
          <li id="mi-0">
            <input id="b-menu" type="checkbox"/>
            <label for="b-menu"></label>
          </li>
          <li id="mi-1">
            <a href="../" id="s-logo" title="epub-js library"></a>
          </li>
          <li id="mi-2">
            <a href="../docs/">Docs</a>
          </li>
          <li id="mi-3">
            <a href="../examples/">Examples</a>
          </li>
          <li id="mi-4" class="active">
            <a href="./" class="active">Test</a>
            <label for="reporter-mode"></label>
            <select name="rp-type" id="reporter-mode">
              <option value="html">html</option>
              <option value="spec">spec</option>
            </select>
            <label for="reporter-target"></label>
            <select name="rp-list" id="reporter-target">
              <option value="main">main</option>
            </select>
          </li>
          <li id="mi-5">
            <a id="gh-link" href="https://github.com/intity/epub-js/tree/master/test" target="_blank"></a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="mocha">
      <script type="text/javascript" class="mocha-init">
        const rpm = document.getElementById("reporter-mode");
        const rpt = document.getElementById("reporter-target");
        const name = "epub-js-test";
        const inst = localforage.createInstance({ name });
        qtar.forEach((t, i) => {
          if (i) {
            const opt = document.createElement("option");
            opt.value = qtar[i].toLowerCase();
            opt.text = t;
            rpt.append(opt);
          }
        });
        const data = {
          host: location.host,
          href: location.href,
          rpti: 0,
          rpmi: 0,
          rptq: grep(location.search)
        };
        const pkey = hash(location.origin);
        rpm.onchange = (e) => {
          data.rpmi = e.target.selectedIndex; // save mod_index
          inst.setItem(pkey, data).then(() => {
            location.reload(); // recursive call
          });
        };
        rpt.onchange = (e) => {
          data.rpti = e.target.selectedIndex; // save tar_index
          data.rptq = data.rpti ? `?grep=%5E${qtar[data.rpti]}` : "";
          inst.setItem(pkey, data).then(() => {
            location.search = data.rptq; // recursive call
          });
        };
        inst.getItem(pkey).then(d => {
          let mi = 0, ti = 0;
          if (!d) {
            inst.setItem(pkey, data); // default dataset
          } else if (grep(location.search) === d.rptq) {
            data.rpmi = mi = d.rpmi;
            data.rpti = ti = d.rpti;
            data.rptq = d.rptq;
          } else {
            data.rpmi = mi = d.rpmi;
            data.rptq = location.search;
          }
          rpm.value = mtar[mi];
          rpt.value = qtar[ti].toLowerCase();
          //rpt.disabled = data.rpmi === 0;
        }).then(() => {
          mocha.setup({
            bail: true,
            color: true,
            checkLeaks: true,
            reporter: rpm.value,
            ui: "bdd"
          });
        });
      </script>
    </main>
    <div id="viewport"></div>
  </body>

</html>
