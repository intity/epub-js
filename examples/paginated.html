<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,spread,example">
    <meta name="description" content="spreading a dociment into pages">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="../assets/css/main.css">
    <script type="text/javascript" src="../dist/public/epub.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module">
      const divider = document.getElementById("divider");
      const loader = document.getElementById("loader");
      const sbtn = document.getElementById("spread");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const size = window.innerHeight - 160;
      const func = (n) => Math.floor(1/Math.sqrt(2)*size)*n;
      const url = new URL(window.location);
      const wrm = url.searchParams.get("wrm");
      const isv = wrm === "vertical-rl";
      const bookPath = isv ? "../assets/kusamakura/" : "../assets/alice/";
      const book = ePub(bookPath, { format: "json" });
      const props = {
        width: sbtn.checked ? func(2) : func(1),
        height: size,
        spread: sbtn.checked ? "auto" : "none",
        minSpreadWidth: func(1)
      };
      const rendition = book.renderTo("viewport", props);
      book.opened.then(() => {
        loader.style.display = "none";
      });
      prev.onclick = (e) => {
        rendition.prev();
        e.preventDefault();
      };
      next.onclick = (e) => {
        rendition.next();
        e.preventDefault();
      };
      sbtn.onclick = (e) => {
        const value = e.target.checked;
        props.width = value ? func(2) : func(1);
        props.height = size;
        props.spread = value ? "auto" : "none";
        rendition.resize(props.width, props.height);
        rendition.updateLayout(props);
      };
      const update = (loc) => {
        const div = rendition.layout.divisor;
        const vph = rendition.layout.writingMode === "horizontal-tb";
        sbtn.checked = rendition.layout.spread === "auto";
        prev.style.display = loc.start.bin ? "none" : "block";
        next.style.display = loc.end.bin ? "none" : "block";
        prev.style["background-image"] = vph ? "url(../assets/img/prev.svg)" : "url(../assets/img/up.svg)";
        next.style["background-image"] = vph ? "url(../assets/img/next.svg)" : "url(../assets/img/down.svg)";
        divider.style.height = `${rendition.layout.height - 10}px`;
        divider.style.display = div === 1 ? "none" : "block";
      };
      const keybinding = (e) => {
        const ish = rendition.layout.writingMode === "horizontal-tb";
        const isv = rendition.layout.writingMode === "vertical-rl";
        switch (e.key) {
          case "ArrowLeft":
            ish && rendition.prev();
            break;
          case "ArrowRight":
            ish && rendition.next();
            break;
          case "ArrowUp":
            isv && rendition.prev();
            break;
          case "ArrowDown":
            isv && rendition.next();
            break;
        }
      };
      rendition.display().then(() => {
        document.onkeyup = keybinding;
        rendition.on("keyup", keybinding);
      });
      rendition.on("attached", () => {
        console.log(rendition);
      });
      rendition.on("resized", (rect) => {
        update(rendition.currentLocation());
        console.log(rect);
      });
      rendition.on("relocated", (loc) => {
        update(loc);
        console.log(loc);
      });
    </script>
    <title>epub-js-examples : Spreading a document into pages</title>
  </head>

  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">
          <li id="mi-0" class="l-item">
            <input id="b-menu" type="checkbox"/>
            <label for="b-menu"></label>
          </li>
          <li id="mi-1" class="l-item">
            <a id="s-logo" href="../" title="epub-js"></a>
          </li>
          <li id="mi-2" class="l-item">
            <a href="../docs">Docs</a>
          </li>
          <li id="mi-3" class="l-item active">
            <a href="./">Examples</a>
          </li>
          <li id="mi-4" class="l-item">
            <a href="../test">Test</a>
          </li>
          <li id="mi-5" class="r-item">
            <a id="gh-link" href="https://github.com/intity/epub-js/blob/master/examples/paginated.html" target="_blank"></a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="content" class="ltr" dir="ltr">
      <div id="viewport" class="paginated ltr" dir="ltr">
        <div id="divider"></div>
        <div id="loader"></div>
      </div>
    </main>
    <footer>
      <nav>
        <ul>
          <li id="ti-0" class="l-item">
            <a id="prev" href="#prev"></a>
          </li>
          <li id="ti-1" class="c-item">
            <input id="spread" type="checkbox"/>
            <label for="spread"></label>
          </li>
          <li id="ti-2" class="r-item">
            <a id="next" href="#prev"></a>
          </li>
        </ul>
      </nav>
    </footer>
  </body>

</html>
