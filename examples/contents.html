  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">

      </nav>
    </header>
    <main id="content"></main>
    <footer></footer>
    <script type="text/javascript">
      const main = document.getElementById("content");
      const book = ePub();
      const cfi = "epubcfi(/6/14!/4/2,/2[pgepubid00007]/1:4,/12/1:142)";
      book.open("../assets/alice/").then(() => {
        console.log(book);
        book.getRange(cfi).then((range) => {
          const text = range.toString();
          const page = document.createElement("div");
          page.className = "page";
          page.innerText = text;
          main.appendChild(page);
          console.log(text);
        });
      });
    </script>
  </body>
