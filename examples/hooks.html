<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,hooks,example">
    <meta name="description" content="example of hooks">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="../assets/css/main.css">
    <script type="text/javascript" src="../dist/public/epub.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <title>epub-js-examples : Hooks</title>
  </head>

  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">
          <li id="mi-0">
            <input id="b-menu" type="checkbox"/>
            <label for="b-menu"></label>
          </li>
          <li id="mi-1">
            <a id="s-logo" href="../" title="epub-js library"></a>
          </li>
          <li id="mi-2">
            <a href="../docs">Docs</a>
          </li>
          <li id="mi-3" class="active">
            <a href="./">Examples</a>
          </li>
          <li id="mi-4">
            <a href="../test">Test</a>
          </li>
          <li id="mi-5">
            <a id="gh-link" href="https://github.com/intity/epub-js/blob/master/examples/hooks.html" target="_blank"></a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="content" class="ltr" dir="ltr">
      <div id="viewport" class="scrolled-doc ltr" dir="ltr">
        <div id="loader"></div>
      </div>
    </main>
    <footer>
      <nav>
        <ul>
          <li class="l-item">
            <a id="prev" href="#prev"></a>
          </li>
          <li class="r-item">
            <a id="next" href="#next"></a>
          </li>
        </ul>
      </nav>
    </footer>
    <script type="text/javascript">
      const loader = document.getElementById("loader");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const book = ePub("../assets/alice/");
      const size = window.innerHeight - 160;
      const rendition = book.renderTo("viewport", {
        flow: "scrolled",
        width: Math.floor(1/Math.sqrt(2)*size),
        height: size,
        // sandbox: ["allow-same-origin", "allow-scripts"]
      });
      book.opened.then(() => {
        loader.style.display = "none";
      });
      next.onclick = (e) => {
        rendition.next();
        e.preventDefault();
      }
      prev.onclick = (e) => {
        rendition.prev();
        e.preventDefault();
      }
      const update = (loc) => {
        prev.style.display = loc.start.bin ? "none" : "block";
        next.style.display = loc.end.bin ? "none" : "block";
      }
      rendition.display("chapter_001.xhtml");
      rendition.on("rendered", (view) => {
        console.log(view.contents);
      });
      rendition.on("relocated", (loc) => {
        update(loc);
      });
      // Hooks: Add several scripts / css
      rendition.hooks.content.register((contents) => {
        const src = "https://code.jquery.com/jquery-3.7.1.min.js";
        const css = "https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css";
        const url = location.pathname.replace(".html", ".js");
        return Promise.all([
          contents.appendScript("jquery", src),
          contents.appendStylesheet("jquery", css)
        ]).then(() => {
          contents.appendScript("jqtest", url)
        });
      });
    </script>
  </body>

</html>
