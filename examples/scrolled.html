<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,scrolled,example">
    <meta name="description" content="scrolling a document">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="../assets/css/main.css">
    <script type="text/javascript" src="../dist/epub.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <title>epub-js-examples : Scrolling a document</title>
  </head>

  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">
          <li id="mi-0">
            <input id="b-menu" type="checkbox"/>
            <label for="b=menu"></label>
          </li>
          <li id="mi-1">
            <a id="s-logo" href="../" title="epub-js"></a>
          </li>
          <li id="mi-2">
            <a href="../docs">Docs</a>
          </li>
          <li id="mi-3" class="active">
            <a href="./">Examples</a>
          </li>
          <li id="mi-4">
            <a href="../test">Test</a>
          </li>
          <li id="mi-5">
            <a href="https://github.com/intity/epub-js/blob/master/examples/scrolled.html" id="gh-link" target="_blank"></a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="content" class="ltr" dir="ltr">
      <div id="viewport" class="scrolled">
        <div id="loader"></div>
      </div>
    </main>
    <footer>
      <nav>
        <ul>
          <li class="l-item">
            <a id="prev" href="#prev"></a>
          </li>
          <li class="c-item">
            <label for="sec-index" style="display: none;"></label>
            <input id="sec-index" type="number" min="0" max="99" readonly/>
            <label for="sec-total">/</label>
            <input id="sec-total" type="number" min="0" max="99" readonly/>
          </li>
          <li class="r-item">
            <a id="next" href="#next"></a>
          </li>
        </ul>
      </nav>
    </footer>
    <script type="text/javascript">
      const loader = document.getElementById("loader");
      const seci = document.getElementById("sec-index");
      const sect = document.getElementById("sec-total");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const book = ePub("../assets/alice/");
      const size = window.innerHeight - 160;
      const rendition = book.renderTo("viewport", {
        flow: "scrolled",
        width: Math.floor(1/Math.sqrt(2)*size),
        height: size
      });
      book.opened.then(() => {
        loader.style.display = "none";
      });
      next.onclick = (e) => {
        rendition.next();
        e.preventDefault();
      };
      prev.onclick = (e) => {
        rendition.prev();
        e.preventDefault();
      };
      const update = (loc) => {
        prev.style.display = loc.atStart ? "none" : "block";
        next.style.display = loc.atEnd ? "none" : "block";
        const s_index = loc.start ? loc.start.index : 0;
        const e_index = loc.end ? loc.end.index : 0;
        const n_index = s_index + e_index;
        if (n_index) {
          let delta = 0;
          book.sections.forEach((v,k) => {
            if (!v.linear) {
              delta += 1;
            }
          });
          const tval = book.sections.size - delta;
          seci.value = (n_index / 2) - (delta - 1);
          sect.value = tval;
        }
      };
      const keybinding = (e) => {
        switch (e.key) {
          case "ArrowLeft":
            rendition.prev();
            break;
          case "ArrowRight":
            rendition.next();
            break;
        }
      };
      rendition.display().then(() => {
        document.onkeyup = keybinding;
        rendition.on("keyup", keybinding);
      });
      rendition.on("attached", () => {
        console.log(rendition);
      });
      rendition.on("relocated", (loc) => {
        update(loc);
        console.log(loc);
      });
    </script>
  </body>

</html>
