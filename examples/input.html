<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,input,example">
    <meta name="description" content="example of open book from file">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="../assets/css/main.css">
    <script type="text/javascript" src="../dist/jszip.min.js"></script>
    <script type="text/javascript" src="../dist/epub.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <title>epub-js-examples : Open book from File</title>
  </head>

  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">
          <li id="mi-0">
            <input id="b-menu" type="checkbox"/>
            <label for="b-menu"></label>
          </li>
          <li id="mi-1">
            <a id="s-logo" href="../" title="epub-js"></a>
          </li>
          <li id="mi-2">
            <a href="../docs">Docs</a>
          </li>
          <li id="mi-3" class="active">
            <a href="./">Examples</a>
          </li>
          <li id="mi-4">
            <a href="../test">Test</a>
          </li>
          <li id="mi-5">
            <a href="https://github.com/intity/epub-js/blob/master/examples/input.html" id="gh-link" target="_blank"></a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="content">
      <div id="viewport" class="paginated">
        <div id="divider"></div>
        <div id="loader" style="display: none;"></div>
      </div>
    </main>
    <footer>
      <nav>
        <ul>
          <li class="l-item">
            <a id="prev" href="#prev"></a>
          </li>
          <li class="c-item">
            <label for="openbook"></label>
            <input id="openbook" type="file" accept=".epub"/>
          </li>
          <li class="r-item">
            <a id="next" href="#next"></a>
          </li>
        </ul>
      </nav>
    </footer>
    <script type="text/javascript">
      const openbook = document.getElementById("openbook");
      const content = document.getElementById("content");
      const divider = document.getElementById("divider");
      const loader = document.getElementById("loader");
      const next = document.getElementById("next");
      const prev = document.getElementById("prev");
      const book = ePub();
      let rendition;
      prev.style.display = "none";
      prev.onclick = (e) => {
        rendition.prev();
        e.preventDefault();
      }
      next.style.display = "none";
      next.onclick = (e) => {
        rendition.next();
        e.preventDefault();
      }
      const update = (loc) => {
        const dir = rendition.layout.direction;
        const div = rendition.layout.divisor;
        prev.style.display = loc.start.bin ? "none" : "block";
        next.style.display = loc.end.bin ? "none" : "block";
        divider.style.display = div === 1 ? "none" : "block";
        content.className = dir;
        content.dir = dir;
      }
      const keybinding = (e) => {
        const dir = rendition.layout.direction;
        switch (e.key) {
          case "ArrowLeft":
            dir === "ltr" ? rendition.prev() : rendition.next();
            break;
          case "ArrowRight":
            dir === "ltr" ? rendition.next() : rendition.prev();
            break;
        }
      }
      const init = (data) => {
        loader.style.display = "block";
        if (rendition) {
          rendition.destroy();
        }
        book.clear(); // clear parts
        book.open(data, "binary").then(() => {
          console.log(book);
          rendition.on("keyup", keybinding);
          document.onkeyup = keybinding;
          loader.style.display = "none";
        });
        rendition = book.renderTo("viewport", {
          width: 908,
          height: 600
        });
        rendition.display().then((section) => {
          console.log(section);
        });
        rendition.on("relocated", (location) => {
          update(location);
          console.log(location);
        });
      }
      const onload = (e) => {
        init(e.target.result);
      }
      openbook.onchange = (e) => {
        const file = e.target.files[0];
        if (window.FileReader) {
          const reader = new FileReader();
          reader.onload = onload;
          reader.readAsArrayBuffer(file);
        }
      }
    </script>
  </body>

</html>
