<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,input,example">
    <meta name="description" content="example of open book from file">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="../assets/css/main.css">
    <script type="text/javascript" src="../dist/public/jszip.min.js"></script>
    <script type="text/javascript" src="../dist/public/epub.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <title>epub-js-examples : Open book from File</title>
  </head>

  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">
          <li id="mi-0">
            <input id="b-menu" type="checkbox"/>
            <label for="b-menu"></label>
          </li>
          <li id="mi-1">
            <a id="s-logo" href="../" title="epub-js"></a>
          </li>
          <li id="mi-2">
            <a href="../docs">Docs</a>
          </li>
          <li id="mi-3" class="active">
            <a href="./">Examples</a>
          </li>
          <li id="mi-4">
            <a href="../test">Test</a>
          </li>
          <li id="mi-5">
            <a href="https://github.com/intity/epub-js/blob/master/examples/input.html" id="gh-link" target="_blank"></a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="content">
      <div id="viewport" class="paginated">
        <div id="divider"></div>
        <div id="loader" style="display: none;"></div>
      </div>
      <div id="sidebar">
        <label for="openbook"></label>
        <input id="openbook" type="file" accept=".epub"/>
      </div>
    </main>
    <footer>
      <nav>
        <ul id="tbox" class="m-line">
          <li id="ti-0" class="l-item">
            <a id="prev" href="#prev"></a>
          </li>
          <li id="ti-1" class="c-item" style="display: none;">
            <label for="layout-wrm" title="Layout Writing Mode">LWM:</label>
            <select id="layout-wrm">
              <option value="horizontal-tb">horizontal-tb</option>
              <option value="vertical-rl">vertical-rl</option>
              <option value="vertical-lr">vertical-lr</option>
            </select>
            <label for="layout-dir" title="Layout Direction">LD:</label>
            <select id="layout-dir">
              <option value="ltr">ltr</option>
              <option value="rtl">rtl</option>
            </select>
            <label for="spread" title="Layout Spread">LS:</label>
            <select id="spread">
              <option value="none">none</option>
              <option value="auto">auto</option>
            </select>
          </li>
          <li id="ti-2" class="r-item">
            <a id="next" href="#next"></a>
          </li>
        </ul>
      </nav>
    </footer>
    <script type="text/javascript">
      const sbox = document.getElementById("sidebar");
      const tbox = document.getElementById("ti-1");
      const openbook = document.getElementById("openbook");
      const lwrm = document.getElementById("layout-wrm");
      const ldir = document.getElementById("layout-dir");
      const content = document.getElementById("content");
      const divider = document.getElementById("divider");
      const loader = document.getElementById("loader");
      const spread = document.getElementById("spread");
      const next = document.getElementById("next");
      const prev = document.getElementById("prev");
      const book = ePub();
      const size = window.innerHeight - 160;
      const func = (n) => Math.floor(1/Math.sqrt(2)*size)*n;
      let rendition;
      prev.style.display = "none";
      prev.onclick = (e) => {
        rendition.prev();
        e.preventDefault();
      };
      next.style.display = "none";
      next.onclick = (e) => {
        rendition.next();
        e.preventDefault();
      };
      lwrm.onchange = (e) => {
        const value = e.target.value;
        rendition.updateLayout({
          writingMode: value
        });
      };
      ldir.onchange = (e) => {
        rendition.updateLayout({
          direction: e.target.value
        });
      };
      spread.onchange = (e) => {
        const value = e.target.value;
        const props = {
          direction: ldir.value,
          width: value === "none" ? func(1) : func(2),
          height: size,
          spread: value
        };
        rendition.resize(props.width, props.height);
        rendition.updateLayout(props);
      };
      const update = (loc) => {
        const dir = rendition.layout.direction;
        const div = rendition.layout.divisor;
        ldir.value = dir;
        prev.style.display = loc.start.bin ? "none" : "block";
        next.style.display = loc.end.bin ? "none" : "block";
        divider.style.display = div === 1 ? "none" : "block";
        divider.style.height = (rendition.layout.height - 20) + "px";
        content.className = dir;
        content.dir = dir;
        spread.value = rendition.layout.spread;
        spread.disabled = !(rendition.layout.writingMode === "horizontal-tb");
      };
      const keybinding = (e) => {
        const dir = rendition.layout.direction;
        switch (e.key) {
          case "ArrowLeft":
            dir === "ltr" ? rendition.prev() : rendition.next();
            break;
          case "ArrowRight":
            dir === "ltr" ? rendition.next() : rendition.prev();
            break;
        }
      };
      const init = (data) => {
        loader.style.display = "block";
        if (rendition) {
          rendition.destroy();
        }
        book.clear(); // clear parts
        book.open(data, "binary").then(() => {
          console.log(book);
          rendition.on("keyup", keybinding);
          document.onkeyup = keybinding;
          loader.style.display = "none";
          sbox.style.display = "none";
          tbox.style.display = "flex";
        });
        rendition = book.renderTo("viewport", {
          width: spread.value === "none" ? func(1) : func(2),
          height: size,
          spread: spread.value,
          minSpreadWidth: func(1),
          direction: ldir.value,
          writingMode: lwrm.value
        });
        rendition.display().then((section) => {
          console.log(section);
        });
        rendition.on("layout", (props, changed) => {
          if (changed.writingMode) {
            update(rendition.currentLocation());
          }
        });
        rendition.on("relocated", (loc) => {
          console.log(loc);
          update(loc);
        });
      };
      const load = (e) => {
        init(e.target.result);
        openbook.style.display = "none";
      };
      const error = (e) => {
        console.error(e);
        openbook.style.display = "block";
      };
      openbook.onchange = (e) => {
        const file = e.target.files[0];
        if (window.FileReader) {
          const reader = new FileReader();
          reader.onload = load;
          reader.onerror = error;
          reader.readAsArrayBuffer(file);
        }
      };
    </script>
  </body>

</html>
