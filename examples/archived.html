<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,archived,example">
    <meta name="description" content="loading a book from an epub archived">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="../assets/css/main.css">
    <script type="text/javascript" src="../dist/jszip.min.js"></script>
    <script type="text/javascript" src="../dist/epub.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <title>epub-js-examples : Archived</title>
  </head>

  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">
          <li id="mi-0">
            <input id="b-menu" type="checkbox"/>
            <label for="b-menu"></label>
          </li>
          <li id="mi-1">
            <a id="s-logo" href="../" title="epub-js"></a>
          </li>
          <li id="mi-2">
            <a href="../docs">Docs</a>
          </li>
          <li id="mi-3" class="active">
            <a href="./">Examples</a>
          </li>
          <li id="mi-4">
            <a href="../test">Test</a>
          </li>
          <li id="mi-5">
            <a href="https://github.com/intity/epub-js/blob/master/examples/archived.html" id="gh-link" target="_blank"></a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="content" class="ltr" dir="ltr">
      <div id="viewport" class="paginated ltr" dir="ltr">
        <div id="loader"></div>
      </div>
      <a id="prev" href="#prev" class="arrow"></a>
      <a id="next" href="#next" class="arrow"></a>
    </main>
    <footer></footer>
    <script type="text/javascript">
      const loader = document.getElementById("loader");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const book = ePub("../assets/alice.epub");
      const rendition = book.renderTo("viewport", {
        width: 908,
        height: 600,
        spread: "none"
      });
      book.opened.then(() => {
        loader.style.display = "none";
      });
      const keybinding = (e) => {
        switch (e.key) {
          case "ArrowLeft":
            rendition.prev();
            break;
          case "ArrowRight":
            rendition.next();
            break;
        }
      }
      prev.onclick = (e) => {
        rendition.prev();
        e.preventDefault();
      }
      next.onclick = (e) => {
        rendition.next();
        e.preventDefault();
      }
      const update = (loc) => {
        prev.style.display = loc.atStart ? "none" : "block";
        next.style.display = loc.atEnd ? "none" : "block";
      }
      rendition.display().then(() => {
        console.log(book);
        document.onkeyup = keybinding;
        rendition.on("keyup", keybinding);
      });
      rendition.on("relocated", (loc) => {
        update(loc);
        console.log(loc);
      });
    </script>
  </body>

</html>
