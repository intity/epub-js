<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,inline-view,example">
    <meta name="description" content="spreading a dociment into pages">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="../assets/css/main.css">
    <script type="text/javascript" src="../dist/public/epub.js"></script>
    <title>epub-js-examples : InlineView</title>
  </head>

  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">
          <li id="mi-0" class="l-item">
            <input id="b-menu" type="checkbox"/>
            <label for="b-menu"></label>
          </li>
          <li id="mi-1" class="l-item">
            <a id="s-logo" href="../" title="epub-js"></a>
          </li>
          <li id="mi-2" class="l-item">
            <a href="../docs">Docs</a>
          </li>
          <li id="mi-3" class="l-item active">
            <a href="./">Examples</a>
          </li>
          <li id="mi-4" class="l-item">
            <a href="../test">Test</a>
          </li>
          <li id="mi-5" class="r-item">
            <a id="gh-link" href="https://github.com/intity/epub-js/blob/master/examples/inline.html" target="_blank"></a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="content" class="ltr" dir="ltr">
      <div id="viewport" class="paginated ltr" dir="ltr">
        <div id="divider"></div>
        <div id="loader"></div>
      </div>
    </main>
    <footer>
      <nav>
        <ul>
          <li id="ti-0" class="l-item">
            <a id="prev" href="#prev"></a>
          </li>
          <li id="ti-1" class="c-item">
            <input id="spread" type="checkbox"/>
            <label for="spread"></label>
          </li>
          <li id="ti-2" class="r-item">
            <a id="next" href="#prev"></a>
          </li>
        </ul>
      </nav>
    </footer>
    <script>
      const divider = document.getElementById("divider");
      const loader = document.getElementById("loader");
      const spread = document.getElementById("spread");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const book = ePub("../assets/alice/", { replacements: "blobUrl" });
      const size = window.innerHeight - 160;
      const rendition = book.renderTo("viewport", {
        view: "inline",
        width: Math.floor(1/Math.sqrt(2)*size),
        height: size
      });
      book.opened.then(() => {
        loader.style.display = "none";
      });
      prev.onclick = (e) => {
        rendition.prev();
        e.preventDefault();
      };
      next.onclick = (e) => {
        rendition.next();
        e.preventDefault()
      };
      const update = (loc) => {
        const div = rendition.layout.divisor;
        prev.style.display = loc.start.bin ? "none" : "block"
        next.style.display = loc.end.bin ? "none" : "block"
        divider.style.display = div === 1 ? "none" : "block"
      };
      const keybinding = (e) => {
        switch (e.key) {
          case "ArrowLeft":
            rendition.prev();
            break;
          case "ArrowRight":
            rendition.next();
            break;
        }
      };
      spread.onchange = (e) => {
        rendition.updateLayout({
          spread: e.target.value
        });
      };
      rendition.display().then(() => {
        document.onkeyup = keybinding;
        rendition.on("keyup", keybinding);
      });
      rendition.on("attached", () => {
        console.log(rendition);
      });
      rendition.on("relocated", (loc) => {
        console.log(loc);
        update(loc);
      });
    </script>
  </body>

</html>
