<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,locations,example">
    <meta name="description" content="generate epubcfi locations example">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="../assets/css/main.css">
    <script type="text/javascript" src="../dist/epub.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <title>epub-js-examples : Locations</title>
  </head>

  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">
          <li id="mi-0">
            <input id="b-menu" type="checkbox"/>
            <label for="b-menu"></label>
          </li>
          <li id="mi-1">
            <a id="s-logo" href="../" title="epub-js"></a>
          </li>
          <li id="mi-2">
            <a href="../docs">Docs</a>
          </li>
          <li id="mi-3" class="active">
            <a href="./">Examples</a>
          </li>
          <li id="mi-4">
            <a href="../test">Test</a>
          </li>
          <li id="mi-5">
            <a href="https://github.com/intity/epub-js/blob/master/examples/locations.html" id="gh-link" target="_blank"></a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="content" class="ltr" dir="ltr">
      <div id="viewport" class="paginated ltr" dir="ltr">
        <div id="loader"></div>
      </div>
      <div id="sidebar">
        <label id="range-value" for="range"></label>
      </div>
    </main>
    <footer>
      <nav>
        <ul id="tbox" class="m-line">
          <li id="ti-0" class="l-item">
            <a id="prev" href="#prev"></a>
          </li>
          <li id="ti-1" class="c-item">
            <input id="range" type="range" min="0" max="100" value="0"/>
            <!--<label id="range-value" for="range"></label>-->
          </li>
          <li id="ti-2" class="r-item">
            <a id="next" href="#next"></a>
          </li>
        </ul>
      </nav>
    </footer>
    <script type="text/javascript">
      const loader = document.getElementById("loader");
      const sidebar = document.getElementById("sidebar");
      const label = document.getElementById("range-value");
      const range = document.getElementById("range");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const book = ePub();
      let stored, timeStamp;
      book.open("../assets/alice/").then(() => {
        loader.style.display = "none";
        // Load in stored locations from json or local storage
        const key = book.key() + "-locations";
        stored = localStorage.getItem(key);
        if (stored) {
          timeStamp = Date.now();
          return book.locations.load(stored);
        } else {
          timeStamp = Date.now();
          // Or generate the locations on the fly
          // Can pass an option number of chars to break sections by
          // default is 150 chars
          // test: [break:549,items:101] (sections:2-12,pages:37)
          //  2:[0]
          //  3:[1-4-8-12]
          //  4:[14-18-21-24]
          //  5:[25-28-31-34-35]
          //  6:[36-41-44-48]
          //  7:[50-53-56-60]
          //  8:[61-65-69]
          //  9:[71-74-76]
          // 10:[77-81-84-88]
          // 11:[89-92]
          // 12:[95-98-100]
          return book.locations.generate(550); // 549
        }
      }).then((locations) => {
        // Save out the generated locations to JSON
        const data = locations.save();
        localStorage.setItem(book.key() + '-locations', data);
        console.log("locations.length: " + locations.size);
        if (stored) {
          console.log(`locations.load: ${Date.now() - timeStamp} ms`);
        } else {
          console.log(`locations.generate: ${Date.now() - timeStamp} ms`);
        }
        console.log(book);
      });
      book.locations.on("changed", (current, changed) => {
        console.log(current, changed);
      });
      const size = window.innerHeight - 160;
      const rendition = book.renderTo("viewport", {
        width: Math.floor(1/Math.sqrt(2)*size),
        height: size,
        spread: "none"
      });
      let percentage;
      range.onchange = (e) => {
        percentage = parseInt(e.target.value) / 100;
        book.locations.set({ percentage });
        rendition.display(book.locations.current.cfi);
      };
      prev.onclick = (e) => {
        rendition.prev();
        e.preventDefault();
      };
      next.onclick = (e) => {
        rendition.next();
        e.preventDefault();
      };
      const update = (loc) => {
        prev.style.display = loc.atStart ? "none" : "block";
        next.style.display = loc.atEnd ? "none" : "block";

        if (typeof percentage === "undefined") {
          book.locations.set({ cfi: loc.start.cfi });
          percentage = book.locations.current.percentage || 0;
        }

        const value = Math.floor(percentage * 100);
        range.value = value;
        label.textContent = percentage;
        percentage = undefined;
      };
      const keybinding = (e) => {
        switch (e.key) {
          case "ArrowLeft":
            rendition.prev();
            break;
          case "ArrowRight":
            rendition.next();
            break;
        }
      };
      rendition.display().then(() => {
        document.onkeyup = keybinding;
        rendition.on("keyup", keybinding);
      });
      /*rendition.on("resized", (rect) => {
        console.log(rect)
      });*/
      rendition.on("relocated", (loc) => {
        update(loc);
      });
    </script>
  </body>

</html>
