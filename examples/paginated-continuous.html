<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,paginated,swiping,mobile,example">
    <meta name="description" content="continuous swiping of pages example for mobile devices">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="../assets/css/main.css">
    <script type="text/javascript" src="../dist/public/epub.js"></script>
    <script type="module">
      const url = new URL(window.location);
      const wrm = url.searchParams.get("wrm");
      const isv = wrm === "vertical-rl";
      const swipe = "ontouchstart" in window;
      const loader = document.getElementById("loader");
      const bookPath = isv ? "../assets/kusamakura/" : "../assets/alice/";
      const book = ePub(bookPath, { format: "json" });
      const opts = {
        manager: swipe ? "continuous" : "default",
        flow: "paginated",
        snap: swipe ? {} : null,
        spread: "none",
        width: "100vw",
        height: "100vh"
      };
      const rendition = book.renderTo(document.body, opts);
      const keybinding = (e) => {
        const ish = rendition.layout.writingMode === "horizontal-tb";
        const isv = rendition.layout.writingMode === "vertical-rl";
        switch (e.key) {
          case "ArrowLeft":
            ish && rendition.prev();
            break;
          case "ArrowRight":
            ish && rendition.next();
            break;
          case "ArrowUp":
            isv && rendition.prev();
            break;
          case "ArrowDown":
            isv && rendition.next();
            break;
        }
      };
      book.opened.then(() => {
        loader.style.display = "none";
      });
      rendition.display().then(() => {
        document.onkeyup = keybinding;
        rendition.on("keyup", keybinding);
      });
      rendition.on("attached", () => {
        console.log(rendition);
      });
      rendition.on("rendered", (view) => {
        console.log("rendered:", view);
      });
      rendition.on("relocated", (loc) => {
        console.log("relocated", loc);
      });
    </script>
    <title>epub-js-examples : Continuous swiping of pages (mobile)</title>
  </head>

  <body id="viewport" class="paginated ltr" dir="ltr">
    <div id="loader"></div>
  </body>

</html>
