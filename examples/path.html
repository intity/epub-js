<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="epub.js,epub-js,bookpath,example">
    <meta name="description" content="open book from seatch options">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" type="text/css" href="../assets/css/main.css">
    <script type="text/javascript" src="../dist/jszip.min.js"></script>
    <script type="text/javascript" src="../dist/epub.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <title>epub-js-examples : Open book from search options</title>
  </head>

  <body id="app">
    <header>
      <nav>
        <ul id="mbox" class="m-line">
          <li id="mi-0">
            <input id="b-menu" type="checkbox"/>
            <label for="b-menu"></label>
          </li>
          <li id="mi-1">
            <a id="s-logo" href="../" title="epub-js library"></a>
          </li>
          <li id="mi-2">
            <a href="../docs">Docs</a>
          </li>
          <li id="mi-3" class="active">
            <a href="./">Examples</a>
          </li>
          <li id="mi-4">
            <a href="../">Test</a>
          </li>
          <li id="mi-5">
            <a href="https://github.com/intity/epub-js/blob/master/examples/path.html" id="gh-link" target="_blank"></a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="content" class="ltr" dir="ltr">
      <div id="viewport" class="paginated ltr" dir="ltr">
        <div id="loader"></div>
      </div>
    </main>
    <footer>
      <nav>
        <ul>
          <li class="l-item">
            <a id="prev" href="#prev"></a>
          </li>
          <li class="r-item">
            <a id="next" href="#next"></a>
          </li>
        </ul>
      </nav>
    </footer>
    <script type="text/javascript">
      const url = new URL(window.location);
      const uri = url.searchParams.get("URI") || "../assets/alice/";
      const content = document.getElementById("content");
      const loader = document.getElementById("loader");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const size = window.innerHeight - 160;
      const time = Date.now();
      const book = ePub(uri);
      const rendition = book.renderTo("viewport", {
        width: Math.floor(1/Math.sqrt(2)*size),
        height: size
      });
      book.opened.then(() => {
        loader.style.display = "none";
      });
      prev.style.display = "none";
      prev.onclick = (e) => {
        rendition.prev();
        e.preventDefault();
      }
      next.style.display = "none";
      next.onclick = (e) => {
        rendition.next();
        e.preventDefault();
      }
      const update = (loc) => {
        const dir = rendition.layout.direction;
        prev.style.display = loc.atStart ? "none" : "block";
        next.style.display = loc.atEnd ? "none" : "block";
        content.className = dir;
        content.dir = dir;
      }
      const keybinding = (e) => {
        const dir = rendition.layout.direction;
        switch (e.key) {
          case "ArrowLeft":
            dir === "ltr" ? rendition.prev() : rendition.next();
            break;
          case "ArrowRight":
            dir === "ltr" ? rendition.next() : rendition.prev();
            break;
        }
      }
      rendition.display().then(() => {
        console.log(book);
        document.onkeyup = keybinding;
        rendition.on("keyup", keybinding);
      });
      rendition.on("relocated", (loc) => {
        update(loc);
        console.log(loc);
      });
      rendition.on("displayed", (section) => {
        console.log(`displayed: ${Date.now() - time} ms`);
      });
      rendition.on("displayerror", (err) => {
        console.log(err);
      });
    </script>
  </body>

</html>
